name: CI / CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite & Stateless Encoding Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            overcooked-agent-eval/requirements.txt
            overcooked-agent-eval/requirements-harl.txt

      - name: Install system dependencies (SDL2, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libfreetype6-dev \
            libportmidi-dev \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e external/overcooked_ai
          python -m pip install -r overcooked-agent-eval/requirements-harl.txt
          python -m pip install pytest pytest-subtests

      - name: Run Test Suite & Stateless Verification
        run: |
          xvfb-run -a ./run_tests.sh
        env:
          MPLBACKEND: "Agg"
          SDL_VIDEODRIVER: "dummy"
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
          TF_CPP_MIN_LOG_LEVEL: "3"
